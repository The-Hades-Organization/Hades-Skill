plugins {
    id 'com.android.application'
}

// o build.sh passa a VERSION da skill; fora dele (gradle direto) fica o valor de desenvolvimento
def hadesVersionCode = Integer.parseInt(System.getenv('HADES_VERSION_CODE') ?: '1')
def hadesVersionName = System.getenv('HADES_VERSION_NAME') ?: '1.0'

android {
    namespace 'dev.hades.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.hades.widget'
        minSdk 26
        targetSdk 34
        versionCode hadesVersionCode
        versionName hadesVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.security:security-crypto:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
