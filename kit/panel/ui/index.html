<script>
  // tema antes do primeiro paint: escolha salva, senão o do sistema
  (() => {
    let t = null;
    try { t = localStorage.getItem('hades-panel-theme'); } catch (e) {}
    if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
  })();
  window.__TOKEN = '__PANEL_TOKEN__';
</script>

/* tokens com os nomes do shadcn (páginas e plugins usam as classes): Marfim no claro, Érebo no escuro. O trilho (sidebar),
   o metal e o rosa vivo são da marca e valem nos dois temas */
:root {
  --background: oklch(0.965 0.012 70);
  --foreground: oklch(0.24 0.05 350);
  --card: oklch(0.985 0.008 70);
  --card-foreground: oklch(0.24 0.05 350);
  --popover: oklch(0.985 0.008 70);
  --popover-foreground: oklch(0.24 0.05 350);
  --primary: #391a2c;
  --primary-foreground: #eddece;
  --secondary: oklch(0.94 0.014 70);
  --secondary-foreground: oklch(0.24 0.05 350);
  --muted: oklch(0.94 0.014 70);
  --muted-foreground: oklch(0.48 0.04 345);
  --accent: oklch(0.94 0.014 70);
  --accent-foreground: oklch(0.24 0.05 350);
  --destructive: oklch(0.52 0.19 32);
  --border: oklch(0.24 0.05 350 / 12%);
  --border-strong: oklch(0.24 0.05 350 / 22%);
  --input: oklch(0.24 0.05 350 / 18%);
  --ring: oklch(0.514 0.222 16.935);
  --vivo: oklch(0.514 0.222 16.935);
  --metal: #ffc6df;
  --metal-ink: oklch(0.6 0.1 350);   /* o metal sobre o marfim some: série e traço usam este */
  --chart-1: var(--vivo);
  --chart-2: var(--info);
  --chart-3: var(--warn);
  --chart-4: var(--ok);
  --chart-5: var(--metal-ink);
  --radius: 0;
  --sidebar: #391a2c;
  --sidebar-foreground: #eddece;
  --sidebar-primary: #ffc6df;
  --sidebar-primary-foreground: #391a2c;
  --sidebar-accent: oklch(0.32 0.06 346);
  --sidebar-accent-foreground: #eddece;
  --sidebar-border: oklch(0.908 0.027 69 / 10%);
  --sidebar-ring: #ffc6df;
  --rail-muted: oklch(0.78 0.035 340);
  --s1: var(--chart-1);
  --s2: var(--chart-2);
  --s3: var(--chart-3);
  --s4: var(--chart-4);
  --ok: oklch(0.5 0.12 160);
  --warn: oklch(0.53 0.13 70);
  --bad: oklch(0.52 0.19 32);
  --info: oklch(0.5 0.1 225);
  --term: oklch(0.17 0.015 345);
  --term-foreground: oklch(0.9 0.02 70);
  --term-muted: oklch(0.68 0.03 340);
  --term-bad: oklch(0.7 0.18 32);   /* o terminal é escuro nos dois temas: estados dele não seguem o claro */
  --term-warn: oklch(0.8 0.14 78);
}
.dark {
  --background: oklch(0.155 0.018 345);
  --foreground: oklch(0.93 0.022 70);
  --card: oklch(0.195 0.022 345);
  --card-foreground: oklch(0.93 0.022 70);
  --popover: oklch(0.235 0.026 345);
  --popover-foreground: oklch(0.93 0.022 70);
  --primary: #ffc6df;
  --primary-foreground: #391a2c;
  --secondary: oklch(0.235 0.026 345);
  --secondary-foreground: oklch(0.93 0.022 70);
  --muted: oklch(0.235 0.026 345);
  --muted-foreground: oklch(0.72 0.03 340);
  --accent: oklch(0.235 0.026 345);
  --accent-foreground: oklch(0.93 0.022 70);
  --destructive: oklch(0.68 0.19 32);
  --border: oklch(0.93 0.022 70 / 10%);

  --ring: oklch(0.586 0.253 17.585);

  --ok: oklch(0.74 0.13 160);

html, body { background: var(--background); color: var(--foreground); }
body { margin: 0; font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; caret-color: var(--vivo); }
/* celular: alvos de toque de pelo menos 44 px (regra do dono). Fora de @layer, vence os utilitários (h-8, size-8) sem tocar no app.js */
/* tablet (768 a 1023 px): o palco do Argos também é de toque; os controles dele (size-8) sobem a 44 px */
@media (max-width: 1023px) {
  [data-argos-stage] button { min-height: 44px; min-width: 44px; }
  [data-argos-stage] [role=switch] { min-height: 0; min-width: 0; }
}
@media (max-width: 767px), (pointer: coarse) {
  button, [role=tab], select, input:not([type=checkbox]):not([type=radio]) { min-height: 44px; }
  button { min-width: 44px; }
  [role=switch] { min-height: 0; min-width: 0; }  /* o Switch tem tamanho próprio (h-5 w-9); o piso de 44px o deformava no celular */
  nav a[href^="#/"] { min-height: 44px; min-width: 44px; }  /* o trilho do shell tem ícones size-9 (36 px) */
  main a[href^="http"] { display: inline-flex; align-items: center; min-height: 44px; }
  /* controles segmentados (h-9 com 3px de folga): crescem junto com os botões de 44 px */
  .p-\[3px\] { height: auto; min-height: 46px; }
  .p-\[3px\] > button { white-space: nowrap; flex-shrink: 0; }
  input[type=checkbox], input[type=radio] { width: 20px; height: 20px; }
}
.tnum { font-variant-numeric: tabular-nums; }
/* escala tipográfica (rem: acompanha o tamanho de fonte do navegador). Os papéis (.t-*, abaixo) e o CSS dos efeitos (fx/) leem daqui */
:root {
  --fs-micro: 0.6875rem; --fs-meta: 0.75rem; --fs-label: 0.8125rem; --fs-body: 0.875rem; --fs-prose: 0.9375rem;
  --elev: 0 1px 2px oklch(0 0 0 / .08), 0 2px 8px oklch(0 0 0 / .06);
  --fs-section: 1rem; --fs-section-lg: 1.125rem; --fs-display: 1.5rem; --fs-page-title: 2rem;
}
/* o fio das Moiras (HadesCore.Fio): fiando (rodando), medido (concluído), cortado (falhou), frouxo (esperando), parado */
.fio { position: relative; height: 2px; width: 100%; }
.fio[data-s=parado] { height: 1px; background: var(--border-strong); }
/* tracejados por máscara: o Firefox não pinta gradiente que mistura cor oklch com transparent */
/* o tracejado vai no ::before: com a máscara no próprio .fio os nós (filhos) sumiam */
.fio[data-s=frouxo]::before { content: ''; position: absolute; inset: 0; background: var(--muted-foreground); mask: repeating-linear-gradient(90deg, #000 0 3px, #0000 3px 7px); opacity: .75; }
.fio[data-s=frouxo] .no { background: var(--muted-foreground); }
.fio[data-s=fiando] { height: 3px; background: var(--vivo); overflow: hidden; }
.fio[data-s=fiando]::after { content: ''; position: absolute; inset: 0; width: 35%;
  background: linear-gradient(90deg, transparent, var(--metal) 50%, transparent); animation: fiar 1.8s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes fiar { from { transform: translateX(-100%) } to { transform: translateX(290%) } }
.fio[data-s=medido] { height: 1.5px; background: var(--foreground); opacity: .85; }
.fio .no { position: absolute; top: 50%; width: 6px; height: 6px; background: var(--foreground); transform: translate(-50%, -50%) rotate(45deg); }
.fio[data-s=fiando] .no { background: var(--metal-ink); }
.fio[data-s=cortado] { background: none; }
.fio[data-s=cortado] > .antes { position: absolute; left: 0; top: 0; height: 2px; background: var(--bad); }
.fio[data-s=cortado] > .depois { position: absolute; right: 0; top: 0; height: 1px; background: var(--border-strong); mask: repeating-linear-gradient(90deg, #000 0 2px, #0000 2px 6px); }
.fio[data-s=cortado] > svg { position: absolute; top: -5px; overflow: visible; color: var(--bad); }
/* o pulso é só de quem pede você (atenção): quem prefere menos movimento recebe o olho parado */
@media (prefers-reduced-motion: no-preference) { .pulso { animation: pulso 2.4s ease-in-out infinite; } }
/* alça de redimensionar do canvas: vence o cursor do nó rico (texto da nota, terminal) enquanto o mouse está nela */
.canvas-resize-cursor, .canvas-resize-cursor * { cursor: var(--canvas-resize-cursor, nwse-resize) !important; }
@keyframes pulso { 50% { opacity: .35 } }
/* o rio do trilho: linha fina com uma correnteza descendo; o óbolo (página ativa) desliza nele; o ponto vivo desce até
   o item onde a atividade começou (--desde = distância do topo do rio) */
.rio { position: absolute; left: 27px; top: 0; bottom: 0; width: 1px; overflow: hidden; pointer-events: none;
  background: color-mix(in oklch, var(--rail-muted) 30%, transparent); }
.rio::after { content: ''; position: absolute; left: 0; width: 1px; height: 120px; top: -120px;
  background: var(--metal); mask: linear-gradient(#0000, #000b, #0000); animation: correnteza 6s linear infinite; }
@keyframes correnteza { to { transform: translateY(calc(100vh + 120px)) } }
.obolo { position: absolute; left: 23px; top: 0; width: 9px; height: 9px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 35%, #fff 0, var(--metal) 45%, oklch(0.7 0.09 350) 100%); box-shadow: 0 1px 2px oklch(0 0 0 / .45);
  transition: transform .42s cubic-bezier(.16,1,.3,1); }
.ponto-vivo { animation: descer .9s cubic-bezier(.16,1,.3,1) both, pulso 2.4s ease-in-out .9s infinite; }
@keyframes descer { from { transform: translateY(var(--desde, 0px)); opacity: .2 } to { transform: none; opacity: 1 } }
.marca { -webkit-mask: url('/ui/brand/hades-mark.svg') center / contain no-repeat; mask: url('/ui/brand/hades-mark.svg') center / contain no-repeat; background: var(--metal); }
/* até o Tailwind compilar a primeira vez, só o fundo (sem flash de HTML cru) */
body:not(.ready) #root { opacity: 0; }
#root { transition: opacity .25s ease; }
/* página registrada com { stage: true }: o canvas ocupa a janela; o rolar da página não existe e o celular respeita a área segura */
.stage-frame { overscroll-behavior: none; padding-bottom: env(safe-area-inset-bottom); }
</style>

  --radius-xl: var(--radius);

  --animate-fade-in: fade-in .25s ease-out both;
  /* a entrada escalonada saiu: a página entra inteira (FadeContent, fx/) e só o dado que mudou se mexe */

  --animate-zoom-in: zoom-in .18s cubic-bezier(.16,1,.3,1) both;

  --animate-shimmer: shimmer 1.6s linear infinite;

  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes zoom-in { from { opacity: 0; transform: translate(-50%, -48%) scale(.96) } to { opacity: 1; transform: translate(-50%, -50%) scale(1) } }
  @keyframes slide-in-right { from { transform: translateX(100%) } to { transform: none } }
  @keyframes slide-in-left { from { transform: translateX(-100%) } to { transform: none } }

  @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @keyframes flash { from { background-color: color-mix(in oklch, var(--warn) 25%, transparent) } to { background-color: transparent } }

/* Papéis tipográficos: o nome diz o propósito, não o valor. Famílias, cores e layout ficam fora (vêm das outras classes);
   quem precisa de exceção soma um utilitário (leading-*, font-*, truncate), que vence o papel. Tabela papel → uso em reference/panel.md */
@utility t-page-title { font-size: var(--fs-page-title); line-height: 1; text-wrap: balance; }                    /* h1 da página (Marcellus vem do h1) */
@utility t-section-lg { font-size: var(--fs-section-lg); line-height: 1.35; font-weight: 600; text-wrap: balance; } /* título de diálogo e de leitura */
@utility t-section { font-size: var(--fs-section); line-height: 1.5rem; font-weight: 600; text-wrap: balance; }      /* título de card e de painel lateral */
@utility t-body-strong { font-size: var(--fs-body); line-height: 1.25rem; font-weight: 600; text-wrap: pretty; }   /* subtítulo dentro do card */
@utility t-body { font-size: var(--fs-body); line-height: 1.25rem; text-wrap: pretty; }                            /* texto de interface, descrição, dica de campo */
@utility t-label { font-size: var(--fs-label); line-height: 1.25rem; font-weight: 500; }                          /* nav, aba, botão, nome de campo, resumo do card */
@utility t-meta-em { font-size: var(--fs-meta); line-height: 1rem; font-weight: 500; }                            /* selo, legenda destacada, botão pequeno */
@utility t-meta { font-size: var(--fs-meta); line-height: 1rem; text-wrap: pretty; }                              /* hora, contagem, caminho, "há 3 min" */
@utility t-micro { font-size: var(--fs-micro); line-height: 1rem; font-weight: 500; }                             /* eixo de gráfico, Kbd, subrótulo de nó SVG */
@utility t-control { font-size: var(--fs-label); line-height: 1.25rem; font-weight: 500; min-height: 2rem; }          /* controle (segmentado, chip, seletor, botão): um corpo e uma altura; 44 px no toque vêm da regra mobile */
@utility t-data { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-meta); line-height: 1rem; } /* número, tempo, id em linha */
@utility t-kpi { font-size: var(--fs-display); line-height: 1.2; font-weight: 600; font-variant-numeric: tabular-nums; text-wrap: balance; } /* número grande de card */
@utility t-code { font-family: var(--font-mono); font-size: var(--fs-meta); line-height: 1.625; }                  /* log, comando, <pre> */
@utility t-code-doc { font-family: var(--font-mono); font-size: var(--fs-label); line-height: 1.625; }            /* <pre> dentro de documento */
@utility t-prose { font-size: var(--fs-prose); line-height: 1.75rem; text-wrap: pretty; }                         /* Docs, Thanatos, resposta do chat */
/* uma elevação só para tudo que flutua sobre o canvas (gaveta, legenda, supervisor, composer, menus): borda leve e sombra curta */
@utility elev-float { border: 1px solid var(--border); box-shadow: var(--elev); }
@utility elev-shadow { box-shadow: var(--elev); } /* a mesma sombra para o que já tem a própria borda (gaveta presa na borda do canvas) */
@layer base {
  * { @apply border-border outline-ring; }
  h1, h2, h3, h4 { text-wrap: balance; }
  p { text-wrap: pretty; }
  /* texto claro no fundo escuro parece mais fino: um fio a mais de tracking nos papéis pequenos */
  .dark :is(.t-meta, .t-meta-em, .t-micro, .t-data) { letter-spacing: 0.01em; }
  ::selection { background: color-mix(in oklch, var(--vivo) 28%, transparent); }
  /* no terminal a seleção é neutra: o rosa sobre o fundo escuro some com o texto vermelho do erro */
  .bg-term ::selection { background: color-mix(in oklch, var(--term-foreground) 26%, transparent); }
  /* a inscrição (Marcellus, um peso só) fica no h1 e na marca; h2–h4 seguem no Figtree */
  h1 { font-family: var(--font-heading); font-weight: 400; font-synthesis: none; letter-spacing: 0.01em; }
  a { text-underline-offset: 3px; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .scrollbar-none { scrollbar-width: none; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-thin { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  /* item de grid encolhe abaixo do maior texto sem quebra (título com reticências, URL, mono): sem isto a coluna
     cresce até o conteúdo e o card vaza. :where = especificidade zero, uma classe min-w-* explícita ainda vence */
  :where(.grid) > * { min-width: 0; }
  /* documentos da skill (Markdown renderizado): tipografia de leitura sem o plugin typography */
  .md { @apply t-prose text-foreground; }
  .md > :first-child { @apply mt-0; }
  .md h1 { @apply mt-2 mb-4 font-semibold tracking-tight; font-size: var(--fs-page-title); line-height: 1.1; }
  .md h2 { @apply mt-10 mb-3 scroll-mt-24 border-b pb-2 font-semibold tracking-tight; font-size: var(--fs-display); line-height: 1.25; }
  .md h3 { @apply mt-8 mb-2 scroll-mt-24 t-section-lg; }
  .md h4 { @apply mt-6 mb-2 t-section; }
  .md p { @apply my-3; }
  .md ul { @apply my-3 list-disc pl-6; } .md ol { @apply my-3 list-decimal pl-6; }
  .md li { @apply my-1; } .md li > ul, .md li > ol { @apply my-1; }
  .md a { @apply font-medium underline underline-offset-4 decoration-border-strong hover:decoration-foreground; }
  .md strong { @apply font-semibold; }
  .md code { @apply bg-muted px-1.5 py-0.5 font-mono text-[0.85em]; overflow-wrap: anywhere; }
  .md pre { @apply my-4 overflow-x-auto border bg-term p-4 t-code-doc text-term-foreground; }
  .md pre code { @apply bg-transparent p-0 text-inherit; }
  .md blockquote { @apply my-4 border-l-2 pl-4 italic text-muted-foreground; }
  .md table { @apply my-4 block w-full overflow-x-auto t-body; border-collapse: collapse; }
  .md th { @apply border-b bg-muted/50 px-3 py-2 text-left font-medium whitespace-nowrap; }
  .md td { @apply border-b px-3 py-2 align-top; }
  .md hr { @apply my-8; }
  /* resposta do chat (página Claude): mesmo markdown, em escala de conversa */
  .md-chat { @apply t-prose leading-6; }
  .md-chat h1, .md-chat h2, .md-chat h3, .md-chat h4 { @apply mt-4 mb-2 border-b-0 pb-0 t-section; }
  .md-chat p { @apply my-2; } .md-chat pre { @apply my-3 p-3 t-code; } .md-chat hr { @apply my-4; }
  .md-chat { overflow-wrap: anywhere; }
  /* nota do canvas (argos/node-note.tsx): o mesmo markdown, compacto; célula com borda; diagrama com "Copiar" ao passar o mouse */
  .md-note { @apply t-label leading-5; overflow-wrap: anywhere; }
  .md-note h1, .md-note h2, .md-note h3, .md-note h4 { @apply mt-3 mb-1 border-b-0 pb-0 t-section; }

  .md-note img { max-width: 100%; height: auto; }
  .note-diagram { @apply relative my-2 flex justify-center; }

  .note-diagram-copy { @apply absolute right-1 top-1 cursor-pointer border bg-card px-1.5 t-label opacity-0; }
  .note-diagram:hover .note-diagram-copy, .note-diagram-copy:focus-visible { @apply opacity-100; }
}
/* celular (<768px): alvo de toque de 44px. Botões e selects crescem; caixa, fechar e copiar log mantêm o desenho e ganham só a área de toque
   (o ::after precisa de ancestral posicionado: esses botões já são relative ou absolute no markup, não force position aqui) */
@media (max-width: 767px) {
  button:not([role=switch]):not([role=checkbox]):not([aria-label=Fechar]):not([aria-label="Copiar log"]), select, a[href]:is(.flex, .inline-flex, .grid) { min-height: 44px; }
  [role=checkbox]::after, [aria-label=Fechar]::after, [aria-label="Copiar log"]::after { content: ''; position: absolute; inset: -16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  /* alternativa parada, não corte: o fio fiando vira torção (hachura), o rio fica sem correnteza, o vivo não pulsa */
  .fio[data-s=fiando] { background: repeating-linear-gradient(90deg, var(--vivo) 0 6px, var(--metal-ink) 6px 8px); }
  .fio[data-s=fiando]::after, .rio::after { display: none; }
}
